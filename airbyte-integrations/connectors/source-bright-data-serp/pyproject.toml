[tool.poetry]
name = "source-brightdata-serp"
version = "0.1.0"
description = "Airbyte connector for Bright Data SERP API"
authors = ["Your Name <email@example.com>"]

[tool.poetry.dependencies]
python = "^3.9"
airbyte-cdk = ">=0.51.0,<1.0.0"
requests = "^2.28.0"
urllib3 = "^1.26.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.0.0"
pytest-mock = "^3.10.0"
requests-mock = "^1.10.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
source-brightdata-serp = "source_brightdata_serp.source:run"