version: "0.61.2"

definitions:
  selector:
    type: RecordSelector
    extractor:
      type: DpathExtractor
      field_path: []

  requester:
    type: HttpRequester
    url_base: "https://api.brightdata.com"
    path: "/datasets/v3/trigger"
    http_method: "POST"
    authenticator:
      type: BearerAuthenticator
      api_token: "{{ config['api_key'] }}"
    request_parameters:
      dataset_id: "{{ config['dataset_id'] }}"
      format: "{{ config.get('format', 'json') }}"
      custom_output_fields: "{{ config.get('custom_output_fields') }}"
      type: "{{ config.get('type') }}"
      discover_by: "{{ config.get('discover_by') }}"
      include_errors: "{{ config.get('include_errors', false) }}"
      limit_per_input: "{{ config.get('limit_per_input') }}"
      limit_multiple_results: "{{ config.get('limit_multiple_results') }}"
      notify: "{{ config.get('notify') }}"
      endpoint: "{{ config.get('endpoint') }}"
      auth_header: "{{ config.get('auth_header') }}"
      uncompressed_webhook: "{{ config.get('uncompressed_webhook', false) }}"
    request_body_json:
      - url: "{{ slice_value }}"
    error_handler:
      type: CompositeErrorHandler
      error_handlers:
        - type: DefaultErrorHandler
          backoff_strategies:
            - type: ExponentialBackoffStrategy
              factor: 5.0
    request_options:
      request_headers:
        Content-Type: "application/json"

streams:
  - type: DeclarativeStream
    name: "web_scraper_results"
    retriever:
      type: SimpleRetriever
      requester:
        $ref: "#/definitions/requester"
      record_selector:
        $ref: "#/definitions/selector"
      paginator:
        type: NoPagination
      partition_router:
        type: ListPartitionRouter
        values: "{{ config['urls'] }}"
        cursor_field: "url"
    transformations:
      - type: AddFields
        fields:
          - path: ["url"]
            value: "{{ stream_slice['url'] }}"
          - path: ["snapshot_id"]
            value: "{{ response['snapshot_id'] }}"
    primary_key:
      - "snapshot_id"
      - "url"
    schema_loader:
      type: JsonFileSchemaLoader
      file_path: "./source_brightdata_web_scraper/schemas/web_scraper_results.json"

check:
  type: CheckStream
  stream_names:
    - "web_scraper_results"

spec:
  type: Spec
  connection_specification:
    type: object
    $schema: "http://json-schema.org/draft-07/schema#"
    required:
      - "api_key"
      - "dataset_id"
      - "urls"
    properties:
      api_key:
        type: string
        description: "Your Bright Data API Key"
        order: 0
        title: "API Key"
        airbyte_secret: true
      dataset_id:
        type: string
        description: "Dataset ID for which data collection is triggered"
        order: 1
        title: "Dataset ID"
        example: "gd_l1vikfnt1wgvvqz95w"
      urls:
        type: array
        description: "List of URLs to scrape"
        items:
          type: string
        order: 2
        title: "URLs"
        example:
          - "https://www.linkedin.com/in/example1"
          - "https://www.linkedin.com/in/example2"
      custom_output_fields:
        type: string
        description: "Filter response data to include only specified fields (pipe-separated)"
        order: 3
        title: "Custom Output Fields"
        example: "url|about.updated_on"
      type:
        type: string
        description: 'Set to "discover_new" to trigger collection with discovery phase'
        enum:
          - "discover_new"
        order: 4
        title: "Collection Type"
      discover_by:
        type: string
        description: "Method for discovering new data"
        enum:
          - "keyword"
          - "best_sellers_url"
          - "category_url"
          - "location"
        order: 5
        title: "Discover By"
      include_errors:
        type: boolean
        description: "Include errors report with results"
        order: 6
        title: "Include Errors"
        default: false
      limit_per_input:
        type: integer
        description: "Limit number of results per input"
        minimum: 1
        order: 7
        title: "Limit Per Input"
      limit_multiple_results:
        type: integer
        description: "Limit total number of results"
        minimum: 1
        order: 8
        title: "Limit Multiple Results"
      notify:
        type: boolean
        description: "Enable notifications upon completion"
        order: 9
        title: "Notify"
        default: false
      endpoint:
        type: string
        description: "Webhook URL for notifications"
        order: 10
        title: "Webhook Endpoint"
      format:
        type: string
        description: "Data delivery format"
        enum:
          - "json"
          - "ndjson"
          - "jsonl"
          - "csv"
        order: 11
        title: "Format"
        default: "json"
      auth_header:
        type: string
        description: "Authorization header for webhook delivery"
        order: 12
        title: "Webhook Auth Header"
      uncompressed_webhook:
        type: boolean
        description: "Send data uncompressed via webhook"
        order: 13
        title: "Uncompressed Webhook"
        default: false
