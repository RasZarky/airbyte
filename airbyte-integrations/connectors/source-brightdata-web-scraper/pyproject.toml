[build-system]
requires = [ "poetry-core>=1.0.0",]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
version = "0.1.0"
name = "source-brightdata-web-scraper"
description = "Source implementation for Bright Data Web Scraper."
authors = [ "Airbyte <contact@airbyte.io>",]
license = "ELv2"
readme = "README.md"
documentation = "https://docs.airbyte.com/integrations/sources/brightdata-web-scraper"
homepage = "https://airbyte.com"
repository = "https://github.com/airbytehq/airbyte"
[[tool.poetry.packages]]
include = "source_brightdata_web_scraper"

[tool.poetry.dependencies]
python = "^3.9,<3.12"
airbyte-cdk = ">=0.51.0,<1.0.0"
requests = "^2.28.0"
pyyaml = "^6.0"

[tool.poetry.scripts]
source-brightdata-web-scraper = "source_brightdata_web_scraper.run:run"

[tool.poetry.group.dev.dependencies]
requests-mock = "^1.9.3"
pytest-mock = "^3.12.0"
pytest = "^8.0.0"

[tool.poe]
include = [
    "${POE_GIT_DIR}/poe-tasks/poetry-connector-tasks.toml",
]